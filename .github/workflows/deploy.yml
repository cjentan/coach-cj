name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; a push while one is running waits.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, linux, x64, deploy]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The self-hosted runner lives on the production host, so we sync the
      # fresh checkout into /docker-data/coach and build there. Building from
      # the deploy dir keeps the compose project name ("coach"), the ./data
      # runtime volumes, and the coach-app/coach-worker image tags identical
      # to the running stack. --delete is deliberately omitted so the runtime
      # data/ dir (and anything else the repo doesn't own) is never touched.
      - name: Sync source to deploy directory
        run: |
          rsync -a \
            --exclude '.git' \
            --exclude 'data' \
            --exclude '.env*' \
            --exclude 'dist-workers' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'coverage' \
            "$GITHUB_WORKSPACE/" /docker-data/coach/

      - name: Build images
        working-directory: /docker-data/coach
        run: docker compose build

      - name: Recreate services
        working-directory: /docker-data/coach
        run: docker compose up -d --force-recreate

      # Probe the app from inside its own container rather than curling host
      # localhost. A self-hosted runner can live in its own network namespace
      # (e.g. a containerized runner) where the host's published port 3000 is
      # unreachable even though the app is up and serving — the previous
      # check failed here twice while the app was healthy. docker exec reaches
      # the app via the docker socket the runner already uses for compose, so
      # it works regardless of how the runner is networked. Allow 5 minutes
      # for cold start (migrations + Next.js boot).
      - name: Wait for app to respond
        run: |
          for i in $(seq 1 150); do
            code=$(docker exec coach-app node -e "fetch('http://localhost:3000/',{redirect:'manual'}).then(r=>{console.log(r.status);process.exit(0)}).catch(()=>process.exit(1))" 2>/dev/null || echo 000)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "app responded with HTTP $code after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "app did not respond within 300s"
          docker compose -f /docker-data/coach/docker-compose.yml ps
          exit 1
