name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; a push while one is running waits.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, linux, x64, deploy]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The self-hosted runner lives on the production host, so we sync the
      # fresh checkout into /docker-data/coach and build there. Building from
      # the deploy dir keeps the compose project name ("coach"), the ./data
      # runtime volumes, and the coach-app/coach-worker image tags identical
      # to the running stack. --delete is deliberately omitted so the runtime
      # data/ dir (and anything else the repo doesn't own) is never touched.
      - name: Sync source to deploy directory
        run: |
          rsync -a \
            --exclude '.git' \
            --exclude 'data' \
            --exclude '.env*' \
            --exclude 'dist-workers' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'coverage' \
            "$GITHUB_WORKSPACE/" /docker-data/coach/

      - name: Build images
        working-directory: /docker-data/coach
        run: docker compose build

      - name: Recreate services
        working-directory: /docker-data/coach
        run: docker compose up -d --force-recreate

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "app responded with HTTP $code after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "app did not respond within 120s"
          docker compose -f /docker-data/coach/docker-compose.yml ps
          exit 1

      # After a fresh image is live, recompute derived columns that are
      # sensitive to the current zone model / workout-type / assessment logic.
      # The scripts live inside the worker image (dist-workers) and are
      # deterministic, so running them on every deploy is safe. A failed
      # backfill fails the deploy so stale data can't ship silently.
      - name: Run post-deploy data backfills
        working-directory: /docker-data/coach
        run: |
          set -e
          echo "::group::recompute-trackpoint-metrics"
          docker compose exec worker node --expose-gc --max-old-space-size=1024 \
            dist-workers/workers/recompute-trackpoint-metrics.js
          echo "::endgroup::"
          echo "::group::reclassify-workout-types"
          docker compose exec worker node --expose-gc --max-old-space-size=1024 \
            dist-workers/workers/reclassify-workout-types.js
          echo "::endgroup::"
          echo "::group::recompute-weekly-assessments"
          docker compose exec worker node --expose-gc --max-old-space-size=1024 \
            dist-workers/workers/recompute-weekly-assessments.js
          echo "::endgroup::"
